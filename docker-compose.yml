services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local-dev
    image: ${DOCKER_IMAGE:-shop-online:local}
    container_name: shop-online
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      PORT: 3000
      HOST_PORT: ${HOST_PORT:-8080}
      DB_PATH: /data/shop.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Chay npm run setup de tao ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Chay npm run setup de tao JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GHN_BASE_URL: ${GHN_BASE_URL:-https://online-gateway.ghn.vn}
      GHN_TOKEN: ${GHN_TOKEN:-}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-}
      GHN_AUTO_CREATE_ORDERS: ${GHN_AUTO_CREATE_ORDERS:-false}
      GHN_WEBHOOK_SECRET: ${GHN_WEBHOOK_SECRET:-}
      GHN_FROM_NAME: ${GHN_FROM_NAME:-}
      GHN_FROM_PHONE: ${GHN_FROM_PHONE:-}
      GHN_FROM_ADDRESS: ${GHN_FROM_ADDRESS:-}
      GHN_FROM_PROVINCE: ${GHN_FROM_PROVINCE:-}
      GHN_FROM_WARD: ${GHN_FROM_WARD:-}
      GHN_FROM_DISTRICT: ${GHN_FROM_DISTRICT:-}
      GHN_DEFAULT_WEIGHT_G: ${GHN_DEFAULT_WEIGHT_G:-}
      GHN_DEFAULT_LENGTH_CM: ${GHN_DEFAULT_LENGTH_CM:-}
      GHN_DEFAULT_WIDTH_CM: ${GHN_DEFAULT_WIDTH_CM:-}
      GHN_DEFAULT_HEIGHT_CM: ${GHN_DEFAULT_HEIGHT_CM:-}
      GHN_REQUIRED_NOTE: ${GHN_REQUIRED_NOTE:-CHOXEMHANGKHONGTHU}
    volumes:
      - shop-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  shop-data:
