<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Đăng nhập quản trị | Home Shopping</title>
  <link rel="stylesheet" href="/admin.css?v=home-admin-6">
  <link rel="stylesheet" href="/home-admin.css?v=3">
  <link rel="stylesheet" href="/workspace-theme.css?v=1">
  <link rel="stylesheet" href="/admin-theme.css?v=3">
  <link rel="stylesheet" href="/admin-login.css?v=1">
  <script>try{document.documentElement.dataset.adminTheme=localStorage.getItem('home-shopping-admin-theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.adminTheme='light'}</script>
  <script src="/admin-login.js?v=1" defer></script>
<link rel="stylesheet" href="/mobile-balance.css?v=1"><link rel="stylesheet" href="/workspace-balance.css?v=whole-workspace-20261112-1"></head>
<body class="admin-page">
  <header>
    <div class="admin-brand"><span class="admin-home-mark" aria-hidden="true">⌂</span><div><small>HOME SHOPPING APP</small><h1>Đăng nhập quản trị</h1></div></div>
    <div class="admin-header-links"><a href="/">Về cửa hàng ↗</a></div>
  </header>
  <main>
    <section class="card login">
      <h2>Đăng nhập quản trị</h2>
      <p>Trang quản trị chỉ dành cho chủ shop và nhân viên được cấp tài khoản.</p>
      <form id="adminLoginForm">
        <label>Tên đăng nhập<input name="username" autocomplete="username" value="admin" required></label>
        <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="adminLoginError" class="form-error" role="alert"></p>
        <button class="primary" type="submit">Đăng nhập</button>
      </form>
    </section>
  </main>
</body>
</html>
