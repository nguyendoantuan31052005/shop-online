<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị đơn hàng</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🛍️ Shop Online</a>
    <input id="token" type="password" placeholder="Mã quản trị (ADMIN_TOKEN)">
    <button id="load" class="btn primary" style="width:auto">Xem đơn</button>
  </header>
  <main>
    <p id="msg" class="msg"></p>
    <div style="overflow-x:auto"><table id="orders" hidden>
      <thead><tr><th>Mã</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tổng</th><th>Thời gian</th><th>Trạng thái</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const vnd = (n) => n.toLocaleString('vi-VN') + '₫';
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const STATUS = { new:'Mới', confirmed:'Đã xác nhận', shipping:'Đang giao', done:'Hoàn thành', cancelled:'Đã hủy' };
    const headers = () => ({ 'x-admin-token': $('#token').value, 'Content-Type': 'application/json' });

    async function load() {
      $('#msg').textContent = '';
      const res = await fetch('/api/admin/orders', { headers: headers() });
      const data = await res.json();
      if (!res.ok) { $('#msg').textContent = data.error; $('#orders').hidden = true; return; }
      $('#orders').hidden = false;
      $('#orders tbody').innerHTML = data.length ? data.map((o) => `
        <tr>
          <td>#${o.id}</td>
          <td>${esc(o.customer_name)}<br>${esc(o.phone)}<br><small>${esc(o.address)}</small></td>
          <td>${o.items.map((i) => `${esc(i.name)} × ${i.quantity}`).join('<br>')}</td>
          <td>${vnd(o.total)}</td>
          <td>${esc(o.created_at)}</td>
          <td><select data-id="${o.id}">${Object.entries(STATUS).map(([k, v]) =>
            `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        </tr>`).join('') : '<tr><td colspan="6">Chưa có đơn hàng.</td></tr>';
    }
    $('#load').onclick = load;
    document.addEventListener('change', async (e) => {
      if (!e.target.dataset.id) return;
      const res = await fetch('/api/admin/orders/' + e.target.dataset.id, {
        method: 'PATCH', headers: headers(), body: JSON.stringify({ status: e.target.value }),
      });
      $('#msg').textContent = res.ok ? 'Đã cập nhật trạng thái.' : (await res.json()).error;
    });
  </script>
</body>
</html>
