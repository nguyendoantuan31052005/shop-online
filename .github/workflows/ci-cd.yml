name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: shop-online

jobs:
  # ---------- CI: test + kiểm tra image chạy được ----------
  test:
    name: Test & Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chạy unit test
        run: npm test

      - name: Build thử Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      - name: Chạy container và kiểm tra /health
        run: |
          docker run -d --name shop -p 8080:3000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/health && break || sleep 2
          done
          curl -fsS http://localhost:8080/api/products | head -c 200
          docker logs shop
          docker rm -f shop

  # ---------- Build image và đẩy lên Docker Hub ----------
  build-and-push:
    name: Build & Push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo tag & label cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- CD: deploy lên server qua SSH ----------
  deploy:
    name: Deploy lên server
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (lấy docker-compose.yml)
        uses: actions/checkout@v4

      - name: Kiểm tra cấu hình server
        id: check
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Chưa cấu hình SERVER_HOST -> bỏ qua bước deploy."
          fi

      - name: Copy docker-compose.yml lên server
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: ~/shop-online

      - name: Pull image mới và khởi động lại container
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/shop-online
            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            export ADMIN_TOKEN='${{ secrets.ADMIN_TOKEN }}'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
